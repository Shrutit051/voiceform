<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VoiceForm</title>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #0f1117;
      color: #e8e8ec;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
    }
    h1 .dot.live { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #toggle { background: #6366f1; color: white; }
    #toggle.stop { background: #ef4444; }
    .row {
      margin-top: 12px;
      font-size: 12px;
      color: #9ca3af;
    }
    .provider {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .provider.rime { background: #1e3a2f; color: #4ade80; }
    .provider.fallback { background: #3a2a1e; color: #f59e0b; }
    #transcript {
      margin-top: 10px;
      padding: 8px;
      background: #1a1c24;
      border-radius: 8px;
      font-size: 12px;
      min-height: 40px;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .hint { font-size: 11px; color: #6b7280; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1><span class="dot" id="dot"></span>VoiceForm</h1>
  <button id="toggle">Start listening</button>
  <div class="row">Speech provider: <span id="provider" class="provider">—</span></div>
  <div id="transcript">Say something like "Name is Shruti"…</div>
  <div class="hint">
    Commands: "&lt;field&gt; is &lt;value&gt;", "tab", "previous field",
    "clear field", "select the &lt;option&gt;", "check the &lt;box&gt;".
    Interrupt anytime by just speaking again.
  </div>
  <script src="popup.js"></script>
</body>
</html>
